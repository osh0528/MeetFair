name: Build APK (gradle, no EAS credit)

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3

      - name: Install deps
        run: npm ci

      - name: Expo prebuild (android)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'https://meetfair-l5ak.onrender.com/api' }}
          EXPO_PUBLIC_SOCKET_URL: ${{ secrets.EXPO_PUBLIC_SOCKET_URL || 'https://meetfair-l5ak.onrender.com' }}
          EXPO_PUBLIC_NAVER_MAP_NCP_KEY_ID: ${{ secrets.EXPO_PUBLIC_NAVER_MAP_NCP_KEY_ID }}
          EXPO_PUBLIC_KAKAO_MAP_JS_KEY: ${{ secrets.EXPO_PUBLIC_KAKAO_MAP_JS_KEY || '6ebc0ef90c92aca9af991a2be136c658' }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || '354665026515-b11kur83lbhpai739kl0gs9fhljkvcle.apps.googleusercontent.com' }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID || '354665026515-b11kur83lbhpai739kl0gs9fhljkvcle.apps.googleusercontent.com' }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID || '354665026515-b11kur83lbhpai739kl0gs9fhljkvcle.apps.googleusercontent.com' }}
          NAVER_MAP_CLIENT_ID: ${{ secrets.NAVER_MAP_CLIENT_ID }}
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Assemble Release APK
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'https://meetfair-l5ak.onrender.com/api' }}
          EXPO_PUBLIC_SOCKET_URL: ${{ secrets.EXPO_PUBLIC_SOCKET_URL || 'https://meetfair-l5ak.onrender.com' }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError" -Dorg.gradle.daemon=false
          _JAVA_OPTIONS: -XX:MaxMetaspaceSize=512m
        run: ./gradlew assembleRelease --stacktrace --no-daemon -Dorg.gradle.workers.max=2

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meetfair-preview-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
